spring.application.name=unitrade-backend
server.port=8080

# Conexión PostgreSQL (ajusta nombre de BD, usuario y contraseña según tu Postgres local)
spring.datasource.url=jdbc:postgresql://localhost:5432/unitrade_db
spring.datasource.username=postgres
spring.datasource.password=2315
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect